<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c09"><title>Mikefit</title><link rel="stylesheet" href="/styles.css?v=11"></head><body><div id="auth-screen" class="auth-shell"><div class="auth-card"><div class="brand">MIKEFIT</div><h1 id="auth-title">Welcome back 👋</h1><p id="auth-subtitle">Sign in to continue your fitness journey.</p><form id="auth-form"><label id="name-field" class="hidden">Name<input id="auth-name" type="text" autocomplete="name" placeholder="Your name"></label><label>Email<input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label><button class="primary-button" type="submit" id="auth-submit">Sign in</button></form><button class="link-button" id="auth-toggle" type="button">Need an account? Sign up</button><p id="auth-message" class="message"></p></div></div><div id="app" class="app hidden"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js?v=11" defer></script><script>
setTimeout(()=>{if(window.mikefitReady)return;const URL='https://ndlizdfcmmywpwrecskx.supabase.co',KEY='sb_publishable_ggDoRBP2Ul658l-7rHKBPQ_WRrrOZqn';const form=document.getElementById('auth-form'),button=document.getElementById('auth-submit'),message=document.getElementById('auth-message'),toggle=document.getElementById('auth-toggle'),nameField=document.getElementById('name-field');if(!form||form.dataset.fallback)return;form.dataset.fallback='1';let signup=false;toggle.onclick=()=>{signup=!signup;nameField.classList.toggle('hidden',!signup);document.getElementById('auth-title').textContent=signup?'Create your account':'Welcome back 👋';document.getElementById('auth-subtitle').textContent=signup?'Start your Mikefit journey today.':'Sign in to continue your fitness journey.';toggle.textContent=signup?'Already have an account? Sign in':'Need an account? Sign up';button.textContent=signup?'Create account':'Sign in'};form.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent='Please wait…';try{const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value,name=document.getElementById('auth-name').value.trim(),sb=window.supabase.createClient(URL,KEY);let result=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{display_name:name||undefined}}}):await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(signup&&!result.data.session){message.textContent='Account created. Check your email to confirm your account.'}else{message.textContent='Authentication successful. Loading Mikefit…';await new Promise(r=>setTimeout(r,300));location.href=location.origin+location.pathname}}catch(err){message.textContent=err.message||'Authentication failed';message.className='message error'}finally{button.disabled=false;button.textContent=signup?'Create account':'Sign in'}}},1500);
</script></body></html>
