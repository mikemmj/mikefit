<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c09"><title>Mikefit</title><link rel="stylesheet" href="/styles.css?v=9"></head><body><div id="auth-screen" class="auth-shell"><div class="auth-card"><div class="brand">MIKEFIT</div><h1 id="auth-title">Welcome back 👋</h1><p id="auth-subtitle">Sign in to continue your fitness journey.</p><form id="auth-form"><label id="name-field" class="hidden">Name<input id="auth-name" type="text" autocomplete="name" placeholder="Your name"></label><label>Email<input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label><button class="primary-button" type="submit" id="auth-submit">Sign in</button></form><button class="link-button" id="auth-toggle" type="button">Need an account? Sign up</button><p id="auth-message" class="message"></p></div></div><div id="app" class="app hidden"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js?v=9" defer></script><script>
const MF_URL='https://ndlizdfcmmywpwrecskx.supabase.co';const MF_KEY='sb_publishable_ggDoRBP2Ul658l-7rHKBPQ_WRrrOZqn';let mfSignup=false;
const $=id=>document.getElementById(id);const msg=(t,e=false)=>{$('auth-message').textContent=t;$('auth-message').className='message '+(e?'error':'')};
$('auth-toggle').onclick=()=>{mfSignup=!mfSignup;$('name-field').classList.toggle('hidden',!mfSignup);$('auth-title').textContent=mfSignup?'Create your account':'Welcome back 👋';$('auth-subtitle').textContent=mfSignup?'Start your Mikefit journey today.':'Sign in to continue your fitness journey.';$('auth-toggle').textContent=mfSignup?'Already have an account? Sign in':'Need an account? Sign up';$('auth-submit').textContent=mfSignup?'Create account':'Sign in';msg('')};
$('auth-form').onsubmit=async e=>{e.preventDefault();const b=$('auth-submit');b.disabled=true;b.textContent='Please wait…';msg('');try{const email=$('auth-email').value.trim(),password=$('auth-password').value,name=$('auth-name').value.trim();const endpoint=mfSignup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const body=mfSignup?{email,password,data:{display_name:name||undefined}}:{email,password};const r=await fetch(MF_URL+endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':MF_KEY},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'Authentication failed');if(mfSignup&&!data.access_token){msg('Account created. Check your email to confirm, then sign in.')}else{msg('Authentication successful. Loading Mikefit…');if(window.supabase?.createClient){const sb=window.supabase.createClient(MF_URL,MF_KEY);if(data.access_token){await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token||''})}}setTimeout(()=>location.reload(),400)}}catch(err){msg(err.message||'Something went wrong.',true)}finally{b.disabled=false;b.textContent=mfSignup?'Create account':'Sign in'}};
</script></body></html>
