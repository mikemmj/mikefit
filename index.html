<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c09"><title>Mikefit</title><link rel="stylesheet" href="/styles.css?v=7"></head><body><div id="auth-screen" class="auth-shell"><div class="auth-card"><div class="brand">MIKEFIT</div><h1 id="auth-title">Welcome back 👋</h1><p id="auth-subtitle">Sign in to continue your fitness journey.</p><form id="auth-form" onsubmit="return window.mikefitSubmit(event)"><label id="name-field" class="hidden">Name<input id="auth-name" type="text" autocomplete="name" placeholder="Your name"></label><label>Email<input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label><button class="primary-button" type="submit" id="auth-submit">Sign in</button></form><button class="link-button" id="auth-toggle" type="button" onclick="window.mikefitToggle()">Need an account? Sign up</button><p id="auth-message" class="message"></p></div></div><div id="app" class="app hidden"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app.js?v=7" defer></script><script>window.mikefitReady=false;window.mikefitToggle=function(){const n=document.getElementById('auth-title'),s=document.getElementById('auth-subtitle'),f=document.getElementById('name-field'),b=document.getElementById('auth-toggle'),q=document.getElementById('auth-submit');const signup=!f.classList.contains('hidden');f.classList.toggle('hidden');n.textContent=signup?'Welcome back 👋':'Create your account';s.textContent=signup?'Sign in to continue your fitness journey.':'Start your Mikefit journey today.';b.textContent=signup?'Need an account? Sign up':'Already have an account? Sign in';q.textContent=signup?'Sign in':'Create account'};window.mikefitSubmit=function(e){e.preventDefault();if(window.mikefitReady&&typeof window.mikefitAuthSubmit==='function')return window.mikefitAuthSubmit(e);const m=document.getElementById('auth-message');m.textContent='Mikefit is loading. Please wait a moment and try again.';m.className='message error';return false};</script></body></html>
