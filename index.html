<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111b">
  <meta name="description" content="MikeFit — simple workouts, nutrition, hydration and progress in one place.">
  <title>MikeFit — Fitness made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=100">
</head>
<body>
  <div id="auth-screen" class="auth-shell">
    <div class="auth-card">
      <div class="brand">MIKE<span>FIT</span></div>
      <span class="eyebrow">FITNESS MADE SIMPLE</span>
      <h1 id="auth-title">Welcome back 👋</h1>
      <p id="auth-subtitle">Sign in to continue your fitness journey.</p>
      <form id="auth-form">
        <label id="name-field" class="hidden">Name<input id="auth-name" type="text" autocomplete="name" maxlength="60" placeholder="Your name"></label>
        <label>Email<input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label>
        <button class="primary-button" type="submit" id="auth-submit">Sign in</button>
      </form>
      <button class="link-button" id="auth-toggle" type="button">Need an account? Sign up</button>
      <p id="auth-message" class="message"></p>
    </div>
  </div>
  <div id="app" class="app hidden"></div>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
  <script src="/app.js?v=100"></script>
</body>
</html>
